openapi: 3.1.0
info:
  title: Canopy Relay API
  version: 1.0.0
  description: Versioned habitat intelligence, governed intervention, offline relay, and durable audit API.
servers:
  - url: http://127.0.0.1:18080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Process is alive
  /readyz:
    get:
      operationId: readiness
      responses:
        '200':
          description: Runtime dependencies are ready
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current source-bound habitat state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/observations:
    post:
      operationId: submitObservation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationRequest' }
      responses:
        '201':
          description: Reading validated and analyzed through the configured upstream pipeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/interventions:
    get:
      operationId: listInterventions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Restart-durable intervention records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Intervention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createIntervention
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterventionRequest' }
      responses:
        '201':
          description: Policy-authorized intervention persisted with audit evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Policy denied before downstream effects or persistence
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/audit:
    get:
      operationId: listAudit
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Hash-chained durable audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/audit/{id}:
    get:
      operationId: getAuditEntry
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Exact audit entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Audit entry not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid operator session
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: Request failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }
        details:
          type: object
          additionalProperties: true
    Coordinates:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
    HabitatZone:
      type: object
      additionalProperties: false
      required: [id, name, region, health, canopy_cover, moisture, anomaly_count, coordinates]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        health: { type: string, enum: [healthy, watch, critical] }
        canopy_cover: { type: number, minimum: 0, maximum: 1 }
        moisture: { type: number, minimum: 0, maximum: 1 }
        anomaly_count: { type: integer, minimum: 0 }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
    Sensor:
      type: object
      additionalProperties: false
      required: [id, label, modality, zone_id, trust_score, calibration_status, signature_verified, last_seen, value, unit]
      properties:
        id: { type: string }
        label: { type: string }
        modality: { type: string }
        zone_id: { type: string }
        trust_score: { type: number, minimum: 0, maximum: 1 }
        calibration_status: { type: string, enum: [verified, drift, quarantined] }
        signature_verified: { type: boolean }
        last_seen: { type: string, format: date-time }
        value: { type: number }
        unit: { type: string }
    Anomaly:
      type: object
      additionalProperties: false
      required: [id, title, zone_id, severity, confidence, status, detected_at, evidence]
      properties:
        id: { type: string }
        title: { type: string }
        zone_id: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [open, reviewing, resolved] }
        detected_at: { type: string, format: date-time }
        evidence:
          type: array
          items: { type: string }
    Intervention:
      type: object
      additionalProperties: false
      required: [id, anomaly_id, action, rationale, risk_level, status, policy_reason, created_at, correlation_id]
      properties:
        id: { type: string }
        anomaly_id: { type: string }
        action: { type: string }
        rationale: { type: string }
        risk_level: { type: string, enum: [low, guarded, restricted] }
        status: { type: string, enum: [proposed, authorized, denied, executed] }
        policy_reason: { type: string }
        created_at: { type: string, format: date-time }
        correlation_id: { type: string }
    MeshLink:
      type: object
      additionalProperties: false
      required: [id, from, to, state, latency_ms, queue_depth, transport, last_sync]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        state: { type: string, enum: [online, delayed, offline] }
        latency_ms: { type: integer, minimum: 0 }
        queue_depth: { type: integer, minimum: 0 }
        transport: { type: string }
        last_sync: { type: string, format: date-time }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, event_type, summary, actor, timestamp, hash, correlation_id]
      properties:
        id: { type: string }
        event_type: { type: string }
        summary: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        hash: { type: string, minLength: 16 }
        correlation_id: { type: string }
    UpstreamStatus:
      type: object
      additionalProperties: false
      required: [name, status, last_operation]
      properties:
        name: { type: string }
        status: { type: string, enum: [ready, degraded, offline] }
        last_operation: { type: string }
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [habitats_online, trusted_sensors, open_anomalies, pending_interventions]
      properties:
        habitats_online: { type: integer, minimum: 0 }
        trusted_sensors: { type: integer, minimum: 0 }
        open_anomalies: { type: integer, minimum: 0 }
        pending_interventions: { type: integer, minimum: 0 }
    Dashboard:
      type: object
      additionalProperties: false
      required: [project_name, generated_at, readiness, correlation_id, summary, habitat_zones, sensors, anomalies, interventions, mesh_links, audit_entries, upstreams]
      properties:
        project_name: { type: string, const: Canopy Relay }
        generated_at: { type: string, format: date-time }
        readiness: { type: string, enum: [ready, degraded] }
        correlation_id: { type: string }
        summary: { $ref: '#/components/schemas/DashboardSummary' }
        habitat_zones:
          type: array
          items: { $ref: '#/components/schemas/HabitatZone' }
        sensors:
          type: array
          items: { $ref: '#/components/schemas/Sensor' }
        anomalies:
          type: array
          items: { $ref: '#/components/schemas/Anomaly' }
        interventions:
          type: array
          items: { $ref: '#/components/schemas/Intervention' }
        mesh_links:
          type: array
          items: { $ref: '#/components/schemas/MeshLink' }
        audit_entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        upstreams:
          type: array
          items: { $ref: '#/components/schemas/UpstreamStatus' }
    ObservationRequest:
      type: object
      additionalProperties: false
      required: [zone_id, sensor_id, signal_kind, value, unit]
      properties:
        zone_id: { type: string, minLength: 1 }
        sensor_id: { type: string, minLength: 1 }
        signal_kind: { type: string, minLength: 1 }
        value: { type: number }
        unit: { type: string, minLength: 1 }
    ObservationResult:
      type: object
      additionalProperties: false
      required: [observation_id, disposition, anomaly, correlation_id, upstream_execution]
      properties:
        observation_id: { type: string }
        disposition: { type: string, enum: [nominal, anomaly] }
        anomaly:
          oneOf:
            - { $ref: '#/components/schemas/Anomaly' }
            - { type: 'null' }
        correlation_id: { type: string }
        upstream_execution:
          type: array
          minItems: 1
          items: { type: string }
    InterventionRequest:
      type: object
      additionalProperties: false
      required: [anomaly_id, action, rationale, risk_level]
      properties:
        anomaly_id: { type: string, minLength: 1 }
        action:
          type: string
          enum: [deploy-mesh-relay, increase-sampling, dispatch-field-review, open-firebreak]
        rationale: { type: string, minLength: 24, maxLength: 1000 }
        risk_level: { type: string, enum: [low, guarded, restricted] }
